[pytest]
# testpaths keeps a bare `pytest` from walking venv/, which holds ~175 test
# files belonging to dependencies — collecting those is slow and their
# failures are not ours.
testpaths = tests
# The modules under test sit at the backend root (meta_capi.py, security.py,
# ...), so the root has to be importable from inside tests/.
pythonpath = .
# dbtest marks the tests that talk to a REAL Supabase database rather than
# running purely in memory — currently the lead-assignment suite, which
# exercises PL/pgSQL functions no unit test can reach.
#
# They are part of the default run on purpose: they cover who receives a lead,
# and therefore whose book it lands in, which is not something to leave
# out of the ordinary `pytest`. They skip themselves when SUPABASE_URL is
# absent, so a fresh checkout still passes.
#
# To skip them deliberately (offline, or for a fast loop):
#     pytest -m "not dbtest"
markers =
    dbtest: talks to a real database; skipped when SUPABASE_* is unset
